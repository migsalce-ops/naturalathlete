<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#000"/>

  <!-- Red bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#ff3b2f"/>

  <!-- Red left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#ff3b2f"/>

  <!-- Staggered staircase headline -->
  <text x="60" y="230"
    font-family="Impact, 'Arial Black', sans-serif"
    font-size="178" fill="#f0f0f0" letter-spacing="-4">KEEP</text>

  <text x="160" y="408"
    font-family="Impact, 'Arial Black', sans-serif"
    font-size="178" fill="#f0f0f0" letter-spacing="-4">STACKING</text>

  <text x="280" y="580"
    font-family="Impact, 'Arial Black', sans-serif"
    font-size="178" fill="#fff" letter-spacing="-4">DAYS</text>

  <!-- Brand name top right -->
  <text x="1160" y="60" text-anchor="end"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="14" font-weight="700" fill="#555"
    letter-spacing="8">NATURAL ATHLETE</text>

  <!-- URL bottom right (over red bar) -->
  <text x="1160" y="616" text-anchor="end"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13" font-weight="600" fill="#000"
    letter-spacing="3">naturalathlete.shop</text>
</svg>
