<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Black background -->
  <rect width="400" height="400" fill="#000"/>

  <!-- White circle fill -->
  <circle cx="200" cy="200" r="185" fill="#fff"/>

  <!-- A — left leg: apex (200,18) → foot (15,386) -->
  <line x1="200" y1="18" x2="15" y2="386" stroke="#000" stroke-width="52" stroke-linecap="butt"/>

  <!-- A — right leg: apex (200,18) → foot (385,386) -->
  <line x1="200" y1="18" x2="385" y2="386" stroke="#000" stroke-width="52" stroke-linecap="butt"/>

  <!-- A — crossbar at ~46% down the legs -->
  <line x1="88" y1="186" x2="312" y2="186" stroke="#000" stroke-width="46" stroke-linecap="butt"/>

  <!-- Large arrow/bolt in lower-left: wide top, diagonal right side,
       two-pronged bottom with notch creating the downward chevron shape -->
  <polygon points="34,208 162,208 216,386 132,386 78,292 34,386" fill="#000"/>

  <!-- Circle ring drawn last to cleanly cap the legs -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#000" stroke-width="32"/>
</svg>
