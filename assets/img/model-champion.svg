<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <rect width="800" height="1000" fill="#000"/>

  <!-- Red horizontal stripe across middle -->
  <rect x="0" y="440" width="800" height="72" fill="#ff3b2f"/>

  <!-- Faint top rule -->
  <rect x="60" y="80" width="680" height="1" fill="#1e1e1e"/>

  <!-- Sport label -->
  <text x="60" y="70"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12" font-weight="700" fill="#ff3b2f"
    letter-spacing="8">BOX · TRAIN</text>

  <!-- Issue number faint -->
  <text x="740" y="200" text-anchor="end"
    font-family="Impact, 'Arial Black', sans-serif"
    font-size="160" fill="#111">03</text>

  <!-- LIMITED badge – sits above the red stripe -->
  <text x="400" y="430" text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13" font-weight="700" fill="#fff"
    letter-spacing="10">LIMITED</text>

  <!-- Main headline — over the red stripe -->
  <text x="400" y="508" text-anchor="middle"
    font-family="Impact, 'Arial Black', sans-serif"
    font-size="134" fill="#fff" letter-spacing="-3">CHAMPION</text>

  <!-- Sub product name -->
  <text x="400" y="580" text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="18" font-weight="400" fill="#555"
    letter-spacing="14">TANK</text>

  <!-- Divider -->
  <rect x="60" y="608" width="680" height="1" fill="#1e1e1e"/>

  <!-- Red accent element -->
  <rect x="60" y="700" width="100" height="3" fill="#ff3b2f"/>

  <!-- Price -->
  <text x="60" y="780"
    font-family="Impact, 'Arial Black', sans-serif"
    font-size="64" fill="#f0f0f0">&#8369;1,150</text>

  <!-- Bottom rule -->
  <rect x="60" y="900" width="680" height="1" fill="#1e1e1e"/>

  <!-- Brand mark -->
  <text x="60" y="940"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11" font-weight="700" fill="#2a2a2a"
    letter-spacing="7">NATURAL ATHLETE</text>

  <text x="740" y="940" text-anchor="end"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11" fill="#2a2a2a" letter-spacing="3">STACK 01</text>
</svg>
